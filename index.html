<!doctype html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大富翁抽籤｜命運加強版</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="ui.css?v=2.6.7"><link rel="stylesheet" href="board.css?v=2.6.7"><link rel="stylesheet" href="themes.css?v=2.6.7"><script type="module" src="app.js?v=2.6.7"></script></head><body class="game-page">
<video id="theme-video" autoplay muted loop playsinline preload="metadata" class="video-background-native" aria-hidden="true"></video><audio id="bgm" src="sound/bgm.mp3" loop></audio><audio id="sfx"></audio>
<header class="topbar"><div class="brand"><span class="brand-icon">🎲</span><div><div class="eyebrow">MONOPOLY CLASSROOM</div><h1>大富翁抽籤 <span class="edition">命運加強版</span></h1></div></div><details id="board-menu" class="board-menu"><summary id="board-menu-toggle" aria-controls="board-menu-controls">☰ 選單</summary><div id="board-menu-controls" class="actions"><select id="temporary-theme" aria-label="本頁主題（不儲存）" title="只在目前頁面生效；主題選擇不儲存"><option value="basic">🎲 迷因主題</option><option value="cat">🐱 貓主題</option><option value="dog">🐶 狗主題</option></select><button id="change-lesson" hidden>切換班別</button><a id="stats-link" class="button" href="admin.html">教師後台 ↗</a><details id="display-settings"><summary>聲音與顯示</summary><div class="display-settings-panel"><label>背景音樂音量 <span id="music-volume-value" aria-hidden="true">10%</span><input id="music-volume" aria-label="背景音樂音量" type="range" min="0" max="100" value="10"></label><label>抽籤音效音量 <span id="effects-volume-value" aria-hidden="true">100%</span><input id="effects-volume" aria-label="抽籤音效音量" type="range" min="0" max="100" value="100"></label><label><span><input id="low-power" type="checkbox"> 低耗能：停用背景影片、減少特效</span></label><label><span><input id="projection-mode" type="checkbox"> 投影：收起頂部工具列（Esc 離開）</span></label><small>聲音及低耗能設定只儲存在這部裝置。</small></div></details><button id="sound-toggle" aria-pressed="true">🔊 音效開啟</button></div></details></header>
<button id="exit-projection" class="exit-projection" hidden>離開投影（Esc）</button><div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<main><section id="lobby" class="panel lobby"><div class="eyebrow">CHOOSE YOUR CLASS</div><h2>今天，輪到誰？</h2><p class="muted">選擇班別，讓每一位同學都有機會。</p><form id="lobby-controls" class="stack" hidden><label>班別<select id="class-select" required></select></label><button class="primary">開始抽籤 →</button><small>每班一份持續記錄，再次進入會沿用原有棋盤及統計。</small></form></section>
<section id="game" hidden><div class="game-context"><span id="context-text"></span></div><div class="board-scroll"><div id="board-container"><div id="center-area"><div class="center-controls"><div class="board-eyebrow">全班都有機會</div><div class="logo-text">MONOPOLY<span>課堂幸運抽籤</span></div><div id="status-text" aria-live="polite">準備好了嗎？</div><div class="dice-container" aria-label="骰子點數"><div class="dice" id="dice1">?</div><div class="dice" id="dice2">?</div></div><div class="actions draw-actions"><button id="roll" class="primary">🎲 擲骰子</button><button id="quick">⚡ 快速抽籤</button></div><button id="recover" class="blue" hidden>恢復上次抽籤結果</button><p id="draw-hint" class="board-hint">機會與命運之後，下一抽必定抽中學生。</p><div id="last-result" class="last-result"></div></div></div></div></div></section></main>
<dialog id="result-modal"><div class="result-box"><div id="result-kicker" class="eyebrow">THE LUCKY ONE</div><h2 id="result-title"></h2><div id="result-display"></div><p id="result-note" class="muted"></p><button id="close-result" class="primary">確定，繼續抽籤</button></div></dialog>
</body></html>
