<!doctype html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主題實景預覽（示範資料）</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="ui.css?v=2.6.7"><link rel="stylesheet" href="board.css?v=2.6.7"><link rel="stylesheet" href="themes.css?v=2.6.7"><script type="module" src="theme-preview.js?v=2.6.7"></script></head><body class="game-page">
<video id="theme-video" autoplay muted loop playsinline preload="metadata" class="video-background-native" aria-hidden="true"></video><header class="topbar"><div class="brand"><span class="brand-icon">🎲</span><div><div class="eyebrow">MONOPOLY CLASSROOM</div><h1>大富翁抽籤 <span class="edition">命運加強版</span></h1></div></div><div class="actions"><span>示範班別 · 主題實景預覽</span></div></header>
