<!doctype html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>我的頭像｜大富翁抽籤</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="ui.css?v=2.6.0"><script type="module" src="student.js?v=2.6.0"></script></head><body><main class="student-shell"><div class="brand" style="margin-bottom:24px"><span class="brand-icon">🐱</span><div><div class="eyebrow">MY CLASSROOM AVATAR</div><h1 style="margin:0">換上你的專屬頭像</h1></div></div><div id="notice" class="notice" role="status" aria-live="polite" hidden></div><section class="panel"><div id="loading">正在讀取你的提交連結⋯</div><div id="student-content" hidden><span id="student-class" class="badge"></span><h2 id="student-name" style="margin-top:16px"></h2><p class="muted">選一張喜歡的圖片，讓老師在課堂棋盤上認出你。</p><div id="upload-status" class="student-status"></div><form id="upload-form" class="stack"><label class="filebox">選擇頭像圖片<input id="avatar-file" type="file" accept="image/gif,image/png,image/jpeg,image/webp" required><small>支援 GIF 動畫、PNG、JPEG、WebP，最多 5 MB。</small></label><div id="preview" class="preview" hidden><img id="preview-image" class="avatar-large" alt="你選擇的頭像預覽"></div><button class="primary">提交給老師審批</button></form><p class="footnote">老師批准後才會顯示。你可重新提交；新圖片待審期間，原有已批准頭像仍會保留。這是你的個人連結，請勿分享給別人。</p></div></section></main></body></html>
