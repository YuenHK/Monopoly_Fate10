name: Refresh weekly classroom background videos
on:
  schedule:
    - cron: '15 22 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: Rotate reviewed clips again even if this week is already updated
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Search metadata only; never approve or publish candidates
        continue-on-error: true
        run: python3 scripts/search-background-candidates.py --output candidate-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: background-candidates
          path: candidate-report.json
          if-no-files-found: ignore
      - name: Verify every reviewed hash and rotate only approved local clips
        env:
          FORCE_REFRESH: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE_REFRESH" = "true" ]; then args+=(--force); fi
          python3 scripts/refresh-background-library.py "${args[@]}"
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Save the verified rotation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add theme-media/library.json theme-media/credits.html theme-media/meme-emoji.mp4 theme-media/meme-ladle.mp4 theme-media/meme-mop.mp4 theme-media/cat-play.mp4 theme-media/cat-sleep.mp4 theme-media/cat-ball.mp4 theme-media/dog-play.mp4 theme-media/dog-sleep.mp4 theme-media/dog-outdoor.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'Rotate reviewed school background videos'
            git push origin HEAD:main
          fi
      - name: Build public board
        run: node scripts/build-pages.mjs
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
